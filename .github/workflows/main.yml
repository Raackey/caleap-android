name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build CaLeap Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version

      - name: Clean stale source from build workspace
        shell: bash
        run: |
          set -euo pipefail

          SRC="app/src/main/java"
          ALLOWED="$SRC/com/maisor/caleap"

          if [ ! -d "$ALLOWED" ]; then
            echo "ERROR: CaLeap source directory is missing: $ALLOWED"
            exit 1
          fi

          echo "Removing Java/Kotlin source outside com/maisor/caleap..."

          find "$SRC" -type f \( -name "*.kt" -o -name "*.java" \) \
            ! -path "$ALLOWED/*" -print -delete

          find "$SRC" -type d -empty -delete || true

          if find "$SRC" -type f \( -name "*.kt" -o -name "*.java" \) \
              ! -path "$ALLOWED/*" | grep -q .; then
            echo "ERROR: stale Java/Kotlin source remains."
            find "$SRC" -type f \( -name "*.kt" -o -name "*.java" \) \
              ! -path "$ALLOWED/*" -print
            exit 1
          fi

          echo "Final Java/Kotlin source tree:"
          find "$SRC" -type f \( -name "*.kt" -o -name "*.java" \) | sort

      - name: Verify no Word2Prompt source
        shell: bash
        run: |
          if find app/src -type f | grep -i "word2prompt"; then
            echo "ERROR: Word2Prompt source still exists."
            exit 1
          fi

          echo "No Word2Prompt source in build context."

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: caleap-v25-3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
